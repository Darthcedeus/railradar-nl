services:
  railradar:
    build: .
    platform: linux/amd64
    restart: unless-stopped
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in Coolify}
      NS_API_SUBSCRIPTION_KEY: ${NS_API_SUBSCRIPTION_KEY:?Set NS_API_SUBSCRIPTION_KEY in Coolify}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in Coolify}
      POLL_SECONDS: ${POLL_SECONDS:-30}
      DEPARTURE_STATIONS: ${DEPARTURE_STATIONS:-}
      DATA_DIR: /data
      PORT: "3000"
    ports:
      - "0.0.0.0:5005:3000"
    volumes:
      - railradar_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  railradar_data:
    external: true
    name: railradar-nl_railradar_data
